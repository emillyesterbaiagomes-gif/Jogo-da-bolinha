<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Não Deixe Cair, sobreviva!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-wrapper">
        <!-- Painel Superior -->
        <header class="hud">
            <div class="score-box">
                <span class="label">PONTOS</span>
                <span id="score" class="value">0</span>
            </div>
            <div class="title">NÃO DEIXE CAIR!</div>
            <div class="score-box">
                <span class="label">RECORDE</span>
                <span id="high-score" class="value">0</span>
            </div>
        </header>

        <!-- Área do Jogo -->
        <div class="canvas-container" id="canvas-container">
            <canvas id="gameCanvas" width="600" height="520"></canvas>

            <!-- Tela Inicial / Game Over -->
            <div id="overlay" class="overlay">
                <h1 id="overlay-title">SOBREVIVA!</h1>
                <p id="overlay-subtitle">Mova o mouse ou use as setas para rebater a bola.</p>
                <div id="final-score-box" class="final-score hidden">
                    Pontuação Final: <strong id="final-score">0</strong>
                </div>
                <button id="start-btn" class="glow-btn">JOGAR</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
